<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>おすすめチャンネル集 - Playlist Viewer</title>

  <style>
    :root {
      --player-width: 45%;
      --player-height: 65vh;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      scroll-behavior: smooth;
      background: #f8f8f8;
      overflow: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      padding: 15px 15px 15px 0;
      gap: 15px;
    }

    /* ==================== サイドバー ==================== */

    #sidebar {
      width: 0;
      overflow: hidden;
      background: white;
      border-radius: 12px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      transition: width 0.4s ease;
      height: 100vh;
      align-self: stretch;
      padding: 15px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      contain: layout style paint;
    }

    #sidebar.open {
      width: 380px;
    }

    .sidebar-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #history,
    #later {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding-right: 8px;
      margin-top: 8px;
      scrollbar-width: thin;
      contain: strict;
    }

    #toggle-container {
      position: fixed;
      left: -2px;
      top: 20px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #toggleHistoryBtn,
    #toggleLaterBtn {
      width: 56px;
      height: 56px;
      background: #0f0f0f;
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55);
      transition: all 0.3s ease;
    }

    #toggleHistoryBtn:hover,
    #toggleLaterBtn:hover {
      background: #000000;
      transform: scale(1.18) translateX(2px);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.7);
    }

    /* ==================== メイン ==================== */

    #main {
      flex: 1;
      display: flex;
      gap: 15px;
      max-width: 1400px;
      width: 100%;
    }

    #player-area {
      width: var(--player-width);
      height: var(--player-height);
      flex-shrink: 0;
      align-self: flex-start;
      position: relative;
      min-width: 320px;
      max-width: 70%;
      background: white;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    #player-horizontal-handle {
      position: absolute;
      top: 0;
      right: -4px;
      width: 9px;
      height: 100%;
      background: transparent;
      cursor: col-resize;
      z-index: 220;
    }

    #vertical-resize-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: #ddd;
      cursor: row-resize;
      z-index: 230;
      transition: background 0.2s;
    }

    #vertical-resize-bar:hover,
    #vertical-resize-bar.active {
      background: #ff0000;
    }

    #resize-bar {
      width: 6px;
      background: #ddd;
      cursor: col-resize;
      border-radius: 3px;
      margin: 0 -3px;
      z-index: 100;
      transition: background 0.2s;
    }

    #resize-bar:hover,
    #resize-bar.active {
      background: #ff0000;
    }

    /* ==================== 動画エリア ==================== */

    #thumbnail-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-height: 100vh;
      position: relative;
      contain: layout style paint;
    }

    h2 {
      margin: 0 0 8px 0;
      text-align: center;
      font-size: 25px;
    }

    #search-container {
      margin-bottom: 18px;
      position: relative;
    }

    #searchInput {
      width: 100%;
      padding: 12px 40px 12px 16px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      box-sizing: border-box;
    }

    #searchInput:focus {
      border-color: #ff0000;
      outline: none;
    }

    #clearSearchBtn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 20px;
      color: #888;
      cursor: pointer;
      display: none;
    }

    #clearSearchBtn:hover {
      color: #ff0000;
    }

    #channel-filter {
      margin-bottom: 12px;
      padding: 10px 12px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 100%;
      background: white;
    }

    #channel-filter:focus {
      border-color: #ff0000;
      outline: none;
    }

    #videos-wrapper {
      flex: 1;
      overflow-y: auto;
      padding-right: 80px;
      position: relative;
      scroll-behavior: smooth;
      contain: strict;
    }

    #videos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .video-item {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,0.1);
      transition: transform 0.2s;
      position: relative;
      contain: layout style paint;
    }

    .video-item:hover {
      transform: translateY(-4px);
    }

    .thumbnail {
      position: relative;
      cursor: pointer;
    }

    .thumbnail img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
    }

    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 60px;
      height: 60px;
      background: rgba(0,0,0,0.78);
      color: white;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 32px;
    }

    .play-btn:hover {
      background: #ff0000;
    }

    .video-title {
      padding: 12px;
      font-size: 14px;
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      position: relative;
      min-height: 78px;
    }

    .copy-btn,
    .later-btn {
      position: absolute;
      top: 10px;
      background: rgba(0,0,0,0.85);
      color: white;
      border: none;
      padding: 5px 10px;
      font-size: 11.5px;
      border-radius: 4px;
      cursor: pointer;
      z-index: 30;
      opacity: 0;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .later-btn {
      right: 12px;
    }

    .copy-btn {
      right: 72px;
    }

    .video-item:hover .copy-btn,
    .video-item:hover .later-btn {
      opacity: 1;
    }

    .copy-btn:hover {
      background: #4caf50;
    }

    .later-btn:hover {
      background: #ff9800;
    }

    .active {
      outline: 4px solid #ff0000;
      outline-offset: -4px;
    }

    /* ==================== 履歴 ==================== */

    .history-item,
    .later-item {
      padding: 11px 12px;
      margin-bottom: 8px;
      background: #f9f9f9;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.45;
      cursor: pointer;
      transition: all 0.2s ease;
      word-break: break-all;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-item:hover,
    .later-item:hover {
      background: #f0f0f0;
      transform: translateX(4px);
    }

    .later-item {
      background: #fff8e1;
    }

    .later-item-content {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .later-close-btn {
      color: #f44336;
      cursor: pointer;
      font-size: 16px;
      margin-left: 8px;
      flex-shrink: 0;
      padding: 0 4px;
      user-select: none;
    }

    /* ==================== 固定ボタン ==================== */

    .fixed-buttons {
      position: fixed;
      right: 75px;
      bottom: 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 500;
    }

    .fixed-btn {
      padding: 13px 26px;
      border: none;
      border-radius: 999px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(0,0,0,0.55);
      transition: all 0.2s;
    }

    .fixed-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.6);
    }

    #jumpBtn {
      background: #ff0000;
    }

    #topBtn {
      background: #333;
    }

    #loading,
    #loadMoreSentinel {
      text-align: center;
      padding: 40px 20px;
      color: #666;
      font-size: 16px;
      grid-column: 1 / -1;
    }

    #loadMoreSentinel {
      padding: 20px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <!-- ==================== サイドバー開閉 ==================== -->

  <div id="toggle-container">
    <button id="toggleHistoryBtn">›</button>
    <button id="toggleLaterBtn">›</button>
  </div>


  <!-- ==================== サイドバー ==================== -->

  <div id="sidebar">

    <div class="sidebar-section" id="historySection">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3>再生履歴</h3>
        <button id="clearHistoryBtn">全削除</button>
      </div>

      <div id="history"></div>

    </div>


    <hr style="border:none; border-top:3px solid #eee; margin:15px 0 25px 0;">


    <div class="sidebar-section" id="laterSection">

      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3>後で見る</h3>
        <button id="clearLaterBtn">全削除</button>
      </div>

      <div id="later"></div>

    </div>

  </div>


  <!-- ==================== メイン ==================== -->

  <div id="main">

    <!-- プレイヤー -->

    <div id="player-area">

      <div id="player"></div>

      <div id="player-horizontal-handle"></div>

      <div id="vertical-resize-bar"></div>

    </div>


    <div id="resize-bar"></div>


    <!-- 動画一覧 -->

    <div id="thumbnail-area">

      <h2>
        おすすめチャンネル集（最新順・2分以内＆ショート除外）
      </h2>


      <select id="channel-filter">

        <option value="">
          すべてのチャンネル
        </option>

      </select>


      <div id="search-container">

        <input
          type="text"
          id="searchInput"
          placeholder="動画タイトルで検索..."
        >

        <button id="clearSearchBtn">
          ×
        </button>

      </div>


      <div id="videos-wrapper">

        <div id="videos"></div>

        <div id="loading">
          全チャンネルを並列取得中...
        </div>

      </div>

    </div>

  </div>


  <!-- ==================== 固定ボタン ==================== -->

  <div class="fixed-buttons">

    <button id="jumpBtn" class="fixed-btn">
      ▶ 再生中へ戻る
    </button>

    <button id="topBtn" class="fixed-btn">
      ↑ サムネイル一番上に戻る
    </button>

  </div>


<script>

  // =========================================================
  // 設定
  // =========================================================

  const apiKey =
    "AIzaSyAxk1YpQSe-qDtFUSUmnjnduanag41Mlyk";


  const playlists = [

    {
      name: "Fラン大学就職チャンネル",
      id: "UUqRV_ZIQhVKfxG1_WkNiRbg"
    },

    {
      name: "トレトレチャンネル",
      id: "UUmD3ZX3hXhihuzVRVe5o27g"
    },

    {
      name: "rの住人ピエロ【哲学】",
      id: "UUY92Ma2-tzt8LLqodw9UF0g"
    },

    {
      name: "RECODE - 知性OSの再定義",
      id: "UUxeOH32jDFcRBV1D2lh7eFQ"
    },

    {
      name: "Paranoia_パラノイア（クリス・ヴォス）",
      id: "UU0PotgTwYxbOZuM9FbWKdcg"
    },

    {
      name: "かもなべ塾講師チャンネル",
      id: "UUT3s5ZjtUhg-TDI-hDYbTyA"
    },

    {
      name: "パイモン大好きおじさん",
      id: "UUo47CdDdWB1sCtShp3KTZMQ"
    },

    {
      name: "気ままに宗教史",
      id: "UUDWGVmCE8WWWjM53QTe5vGA"
    },

    {
      name: "とうけい",
      id: "UU6I4vtYv0c4KkGbzZHZxBsg"
    },

    {
      name: "さくらい",
      id: "UU5CTV3JSdrlo5Pa42QkK8SA"
    },

    {
      name: "かか",
      id: "UU1KM0FPG8NvCWKRZURZZEfQ"
    },

    // 今回追加したプレイリスト
    {
      name: "追加プレイリスト",
      id: "PLC_sUFW5VyimOKPs1Eh36hWmcBuRHGmOy"
    }

  ];


  // APIから一度に取得する件数
  const FETCH_PAGE_SIZE = 50;


  // 初回表示件数
  const INITIAL_RENDER_COUNT = 45;


  // スクロール時の追加表示件数
  const LOAD_MORE_COUNT = 30;


  const historyKey =
    "multi_channel_history";


  const laterKey =
    "multi_channel_later";


  // =========================================================
  // DOM
  // =========================================================

  const sidebar =
    document.getElementById("sidebar");


  const toggleHistoryBtn =
    document.getElementById("toggleHistoryBtn");


  const toggleLaterBtn =
    document.getElementById("toggleLaterBtn");


  const historyBox =
    document.getElementById("history");


  const laterBox =
    document.getElementById("later");


  const player =
    document.getElementById("player");


  const videosContainer =
    document.getElementById("videos");


  const videosWrapper =
    document.getElementById("videos-wrapper");


  const loadingEl =
    document.getElementById("loading");


  const jumpBtn =
    document.getElementById("jumpBtn");


  const topBtn =
    document.getElementById("topBtn");


  const searchInput =
    document.getElementById("searchInput");


  const clearSearchBtn =
    document.getElementById("clearSearchBtn");


  const channelFilter =
    document.getElementById("channel-filter");


  // =========================================================
  // 状態
  // =========================================================

  let currentActive = null;


  let isHistoryVisible = false;


  let isLaterVisible = false;


  let videosData = [];


  let currentFilteredData = [];


  let renderedCount = 0;


  let videoMap = new Map();


  /*
    プレイリストごとのページネーション状態
  */

  let channelStates =
    playlists.map(pl => ({

      pl,

      pageToken: "",

      exhausted: false,

      started: false

    }));


  let isFetchingMore = false;


  let cachedHistory = [];


  let cachedLater = [];


  let sentinelObserver = null;


  const sentinelEl =
    document.createElement("div");


  sentinelEl.id =
    "loadMoreSentinel";


  // =========================================================
  // ストレージ
  // =========================================================

  function loadHistoryFromStorage() {

    try {

      cachedHistory =
        JSON.parse(
          localStorage.getItem(historyKey) || "[]"
        );

    } catch {

      cachedHistory = [];

    }
  }


  function loadLaterFromStorage() {

    try {

      cachedLater =
        JSON.parse(
          localStorage.getItem(laterKey) || "[]"
        );

    } catch {

      cachedLater = [];

    }
  }


  // =========================================================
  // サイドバー
  // =========================================================

  function updateSidebar() {

    const shouldOpen =
      isHistoryVisible ||
      isLaterVisible;


    sidebar.classList.toggle(
      "open",
      shouldOpen
    );


    toggleHistoryBtn.textContent =
      isHistoryVisible ? "‹" : "›";


    toggleLaterBtn.textContent =
      isLaterVisible ? "‹" : "›";


    document.getElementById(
      "historySection"
    ).style.display =
      isHistoryVisible
        ? "flex"
        : "none";


    document.getElementById(
      "laterSection"
    ).style.display =
      isLaterVisible
        ? "flex"
        : "none";
  }


  function toggleHistory() {

    isHistoryVisible =
      !isHistoryVisible;


    updateSidebar();


    if (isHistoryVisible) {

      renderHistory();

    }
  }


  function toggleLater() {

    isLaterVisible =
      !isLaterVisible;


    updateSidebar();


    if (isLaterVisible) {

      renderLater();

    }
  }


  // =========================================================
  // 履歴・後で見る
  // =========================================================

  function saveHistory(video) {

    cachedHistory =
      cachedHistory.filter(
        item =>
          item.id !== video.id
      );


    cachedHistory.unshift(video);


    cachedHistory =
      cachedHistory.slice(
        0,
        30
      );


    localStorage.setItem(
      historyKey,
      JSON.stringify(cachedHistory)
    );


    if (isHistoryVisible) {

      renderHistory();

    }
  }


  function saveLater(video) {

    if (
      cachedLater.some(
        item =>
          item.id === video.id
      )
    ) {

      return;

    }


    cachedLater.unshift(video);


    localStorage.setItem(
      laterKey,
      JSON.stringify(cachedLater)
    );


    if (isLaterVisible) {

      renderLater();

    }
  }


  function removeLater(videoId) {

    cachedLater =
      cachedLater.filter(
        item =>
          item.id !== videoId
      );


    localStorage.setItem(
      laterKey,
      JSON.stringify(cachedLater)
    );


    renderLater();
  }


  function renderHistory() {

    historyBox.innerHTML =
      cachedHistory.length === 0

        ? `
          <p style="color:#888; text-align:center; padding:40px 10px;">
            履歴はありません
          </p>
        `

        : cachedHistory
            .map(
              item => `
                <div
                  class="history-item"
                  data-id="${item.id}"
                >
                  ${item.title}
                </div>
              `
            )
            .join("");
  }


  function renderLater() {

    laterBox.innerHTML =
      cachedLater.length === 0

        ? `
          <p style="color:#888; text-align:center; padding:40px 10px;">
            後で見るリストは空です
          </p>
        `

        : cachedLater
            .map(
              item => `
                <div
                  class="later-item"
                  data-id="${item.id}"
                >

                  <span class="later-item-content">
                    ${item.title}
                  </span>

                  <span class="later-close-btn">
                    ×
                  </span>

                </div>
              `
            )
            .join("");
  }


  function clearHistory() {

    if (
      confirm(
        "再生履歴をすべて削除しますか？"
      )
    ) {

      localStorage.removeItem(
        historyKey
      );


      cachedHistory = [];


      renderHistory();

    }
  }


  function clearLaterList() {

    if (
      confirm(
        "後で見るリストをすべて削除しますか？"
      )
    ) {

      localStorage.removeItem(
        laterKey
      );


      cachedLater = [];


      renderLater();

    }
  }


  // =========================================================
  // 動画再生
  // =========================================================

  async function playVideoById(videoId) {

    let element =
      videoMap.get(videoId);


    if (!element) {

      const wasFiltered =
        searchInput.value.trim() !== "" ||
        channelFilter.value !== "";


      if (wasFiltered) {

        searchInput.value = "";

        channelFilter.value = "";

        clearSearchBtn.style.display =
          "none";

        applyFilter();

      }


      let guard = 0;


      while (
        !videoMap.has(videoId) &&
        renderedCount <
          currentFilteredData.length &&
        guard < 40
      ) {

        renderMore();

        guard++;


        await new Promise(
          r =>
            setTimeout(r, 0)
        );

      }


      element =
        videoMap.get(videoId);

    }


    if (element) {

      element.scrollIntoView({

        behavior: "smooth",

        block: "center"

      });


      setTimeout(() => {

        const titleEl =
          element.querySelector(
            ".video-title"
          );


        const title =
          titleEl
            ? titleEl.textContent.trim()
            : "";


        playVideo(
          videoId,
          title,
          element
        );

      }, 300);


    } else {

      alert(
        "動画が見つかりませんでした。ページを再読み込みしてください。"
      );

    }
  }


  function handleHistoryClick(e) {

    const item =
      e.target.closest(
        ".history-item"
      );


    if (!item) return;


    playVideoById(
      item.dataset.id
    );
  }


  function handleLaterClick(e) {

    const closeBtn =
      e.target.closest(
        ".later-close-btn"
      );


    const itemEl =
      e.target.closest(
        ".later-item"
      );


    if (!itemEl) return;


    if (closeBtn) {

      e.stopImmediatePropagation();


      removeLater(
        itemEl.dataset.id
      );


    } else {

      playVideoById(
        itemEl.dataset.id
      );

    }
  }


  function playVideo(
    videoId,
    title,
    videoItemElement
  ) {

    player.innerHTML =
      `
        <iframe
          src="https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1"
          allow="autoplay; encrypted-media"
          allowfullscreen
        ></iframe>
      `;


    if (currentActive) {

      currentActive.classList.remove(
        "active"
      );

    }


    videoItemElement.classList.add(
      "active"
    );


    currentActive =
      videoItemElement;


    saveHistory({

      id: videoId,

      title

    });
  }


  function copyLink(videoId) {

    navigator.clipboard.writeText(

      `https://www.youtube.com/watch?v=${videoId}`

    ).then(() => {

      const btn =
        event.currentTarget;


      const original =
        btn.textContent;


      btn.textContent =
        "✓ コピー";


      btn.style.background =
        "#4caf50";


      setTimeout(() => {

        btn.textContent =
          original;


        btn.style.background =
          "rgba(0,0,0,0.85)";

      }, 1600);

    });
  }


  function addToLater(
    videoId,
    title
  ) {

    saveLater({

      id: videoId,

      title

    });


    const btn =
      event.currentTarget;


    btn.style.background =
      "#4caf50";


    btn.textContent =
      "✓ 追加";


    setTimeout(() => {

      btn.style.background =
        "rgba(0,0,0,0.85)";


      btn.textContent =
        "後で見る";

    }, 1200);
  }


  // =========================================================
  // フィルター
  // =========================================================

  function applyFilter() {

    const keyword =
      searchInput.value
        .toLowerCase()
        .trim();


    const selectedChannel =
      channelFilter.value;


    currentFilteredData =
      videosData.filter(v => {

        const matchKeyword =
          !keyword ||
          v.title
            .toLowerCase()
            .includes(keyword);


        const matchChannel =
          !selectedChannel ||
          v.channelName ===
            selectedChannel;


        return (
          matchKeyword &&
          matchChannel
        );

      });


    /*
      念のためフィルター結果も
      最新 → 古いで並べる
    */

    currentFilteredData.sort(
      (a, b) =>
        new Date(b.publishedAt) -
        new Date(a.publishedAt)
    );


    videosContainer.innerHTML = "";


    videoMap.clear();


    renderedCount = 0;


    renderMore(
      INITIAL_RENDER_COUNT
    );
  }


  function filterVideos() {

    applyFilter();

  }


  // =========================================================
  // 動画DOM生成
  // =========================================================

  function createVideoElement(v) {

    const el =
      document.createElement(
        "div"
      );


    el.className =
      "video-item";


    el.dataset.id =
      v.videoId;


    el.dataset.channel =
      v.channelName;


    el.innerHTML = `

      <div class="thumbnail">

        <img
          src="${v.thumbnail}"
          loading="lazy"
          alt="${v.title}"
        >

        <div class="play-btn">
          ▶
        </div>

      </div>


      <div class="video-title">

        ${v.title}


        <button class="later-btn">
          後で見る
        </button>


        <button class="copy-btn">
          🔗
        </button>

      </div>

    `;


    el.addEventListener(
      "click",
      e => {

        if (
          !e.target.classList.contains(
            "copy-btn"
          ) &&
          !e.target.classList.contains(
            "later-btn"
          )
        ) {

          playVideo(
            v.videoId,
            v.title,
            el
          );

        }

      }
    );


    el.querySelector(
      ".copy-btn"
    ).addEventListener(
      "click",
      e => {

        e.stopPropagation();


        copyLink(
          v.videoId
        );

      }
    );


    el.querySelector(
      ".later-btn"
    ).addEventListener(
      "click",
      e => {

        e.stopPropagation();


        addToLater(
          v.videoId,
          v.title
        );

      }
    );


    return el;
  }


  // =========================================================
  // プレイリスト状態
  // =========================================================

  function getActiveChannelStates() {

    const selectedChannel =
      channelFilter.value;


    return channelStates.filter(
      s =>
        !s.exhausted &&
        (
          !selectedChannel ||
          s.pl.name ===
            selectedChannel
        )
    );
  }


  function sentinelShouldExist() {

    return (

      renderedCount <
        currentFilteredData.length

      ||

      getActiveChannelStates()
        .length > 0

    );
  }


  function updateSentinelPlacement() {

    if (
      sentinelShouldExist()
    ) {

      videosContainer.appendChild(
        sentinelEl
      );


      observeSentinel();


    } else if (
      sentinelEl.parentNode
    ) {

      sentinelEl.remove();

    }
  }


  function setSentinelLoadingText(
    isLoading
  ) {

    sentinelEl.textContent =
      isLoading
        ? "読み込み中..."
        : "";
  }


  // =========================================================
  // 段階描画
  // =========================================================

  function renderMore(
    count = LOAD_MORE_COUNT
  ) {

    if (
      renderedCount >=
      currentFilteredData.length
    ) {

      updateSentinelPlacement();

      return;
    }


    const end =
      Math.min(

        renderedCount + count,

        currentFilteredData.length

      );


    const fragment =
      document.createDocumentFragment();


    for (
      let i = renderedCount;
      i < end;
      i++
    ) {

      const v =
        currentFilteredData[i];


      const el =
        createVideoElement(v);


      fragment.appendChild(el);


      videoMap.set(
        v.videoId,
        el
      );

    }


    videosContainer.appendChild(
      fragment
    );


    renderedCount =
      end;


    updateSentinelPlacement();
  }


  /*
    新しく取得した動画を
    videosDataへ追加し、
    全体を最新順に再ソートする
  */

  function appendMatchingVideos(
    newVideos
  ) {

    if (!newVideos.length) {
      return;
    }


    const keyword =
      searchInput.value
        .toLowerCase()
        .trim();


    const selectedChannel =
      channelFilter.value;


    const matches =
      newVideos.filter(v => {

        const matchKeyword =
          !keyword ||
          v.title
            .toLowerCase()
            .includes(keyword);


        const matchChannel =
          !selectedChannel ||
          v.channelName ===
            selectedChannel;


        return (
          matchKeyword &&
          matchChannel
        );

      });


    if (!matches.length) {
      return;
    }


    /*
      新規取得分を既存データに統合
    */

    currentFilteredData =
      currentFilteredData.concat(
        matches
      );


    /*
      最新動画を上にする
    */

    currentFilteredData.sort(
      (a, b) =>
        new Date(b.publishedAt) -
        new Date(a.publishedAt)
    );


    /*
      まだ表示していない部分だけでなく、
      並び順変更を反映するため、
      DOMを再構築する
    */

    rebuildRenderedVideos();
  }


  // =========================================================
  // 表示済み動画を最新順で再構築
  // =========================================================

  function rebuildRenderedVideos() {

    const activeId =
      currentActive
        ?.dataset
        ?.id || null;


    const displayData =
      currentFilteredData.slice(
        0,
        renderedCount
      );


    videosContainer.innerHTML = "";


    videoMap.clear();


    const fragment =
      document.createDocumentFragment();


    displayData.forEach(v => {

      const el =
        createVideoElement(v);


      if (
        activeId &&
        v.videoId === activeId
      ) {

        el.classList.add(
          "active"
        );


        currentActive =
          el;
      }


      fragment.appendChild(el);


      videoMap.set(
        v.videoId,
        el
      );

    });


    videosContainer.appendChild(
      fragment
    );


    updateSentinelPlacement();
  }


  // =========================================================
  // 無限スクロール
  // =========================================================

  async function handleLoadMoreTrigger() {

    /*
      まず現在取得済みデータを表示
    */

    if (
      renderedCount <
      currentFilteredData.length
    ) {

      renderMore();

      return;
    }


    const activeStates =
      getActiveChannelStates();


    if (
      !activeStates.length ||
      isFetchingMore
    ) {

      updateSentinelPlacement();

      return;
    }


    isFetchingMore =
      true;


    setSentinelLoadingText(
      true
    );


    try {

      const newVideos =
        await fetchMoreFromChannels(
          activeStates
        );


      /*
        videosData全体を
        最新順に再ソート
      */

      videosData.sort(
        (a, b) =>
          new Date(b.publishedAt) -
          new Date(a.publishedAt)
      );


      appendMatchingVideos(
        newVideos
      );


    } finally {

      isFetchingMore =
        false;


      setSentinelLoadingText(
        false
      );

    }


    /*
      新規取得後、
      最新順のデータから続きを表示
    */

    renderMore();
  }


  function observeSentinel() {

    if (
      !sentinelObserver ||
      !sentinelEl.parentNode
    ) {

      return;

    }


    sentinelObserver.unobserve(
      sentinelEl
    );


    sentinelObserver.observe(
      sentinelEl
    );
  }


  function initInfiniteScroll() {

    sentinelObserver =
      new IntersectionObserver(

        entries => {

          entries.forEach(
            entry => {

              if (
                entry.isIntersecting
              ) {

                handleLoadMoreTrigger();

              }

            }
          );

        },

        {
          root: videosWrapper,

          rootMargin:
            "600px 0px"

        }

      );


    observeSentinel();


    let scrollCheckQueued =
      false;


    videosWrapper.addEventListener(
      "scroll",
      () => {

        if (
          scrollCheckQueued
        ) {

          return;

        }


        scrollCheckQueued =
          true;


        requestAnimationFrame(
          () => {

            scrollCheckQueued =
              false;


            const nearBottom =
              videosWrapper.scrollTop +
              videosWrapper.clientHeight >=
              videosWrapper.scrollHeight -
              800;


            if (nearBottom) {

              handleLoadMoreTrigger();

            }

          }
        );

      }
    );
  }


  // =========================================================
  // YouTube API
  // =========================================================

  async function getVideoDurations(
    videoIds
  ) {

    if (!videoIds.length) {

      return {};

    }


    const durations = {};


    for (
      let i = 0;
      i < videoIds.length;
      i += 50
    ) {

      const batch =
        videoIds.slice(
          i,
          i + 50
        );


      try {

        const res =
          await fetch(

            `https://www.googleapis.com/youtube/v3/videos?part=contentDetails&id=${batch.join(",")}&key=${apiKey}`

          );


        if (res.ok) {

          const data =
            await res.json();


          data.items?.forEach(
            item => {

              durations[item.id] =
                parseISO8601Duration(
                  item.contentDetails.duration
                );

            }
          );

        }

      } catch (e) {

        console.warn(
          "Duration fetch error",
          e
        );

      }

    }


    return durations;
  }


  function parseISO8601Duration(
    duration
  ) {

    const match =
      duration.match(
        /PT(\d+H)?(\d+M)?(\d+S)?/
      );


    let seconds = 0;


    if (match[1]) {

      seconds +=
        parseInt(match[1]) *
        3600;

    }


    if (match[2]) {

      seconds +=
        parseInt(match[2]) *
        60;

    }


    if (match[3]) {

      seconds +=
        parseInt(match[3]);

    }


    return seconds;
  }


  // =========================================================
  // プレイリスト取得
  // =========================================================

  async function fetchChannelPage(
    state
  ) {

    if (
      state.exhausted
    ) {

      return [];

    }


    try {

      /*
        contentDetailsを追加。
        これによりvideoPublishedAtを取得する。
      */

      const res =
        await fetch(

          `https://www.googleapis.com/youtube/v3/playlistItems?part=snippet,contentDetails&maxResults=${FETCH_PAGE_SIZE}&playlistId=${state.pl.id}&key=${apiKey}&pageToken=${state.pageToken}`

        );


      if (!res.ok) {

        state.exhausted =
          true;


        console.error(
          "Playlist API error:",
          res.status,
          state.pl.name
        );


        return [];

      }


      const data =
        await res.json();


      state.pageToken =
        data.nextPageToken ||
        "";


      state.started =
        true;


      if (
        !data.nextPageToken
      ) {

        state.exhausted =
          true;

      }


      return data.items || [];


    } catch (e) {

      console.error(
        "Playlist取得エラー",
        e
      );


      state.exhausted =
        true;


      return [];

    }
  }


  // =========================================================
  // 動画処理
  // =========================================================

  async function processRawItems(
    items,
    pl
  ) {

    if (!items.length) {

      return [];

    }


    const videoIds =
      items
        .map(
          item =>
            item.snippet
              .resourceId
              ?.videoId
        )
        .filter(Boolean);


    const durations =
      await getVideoDurations(
        videoIds
      );


    const added = [];


    items.forEach(item => {

      const rawTitle =
        item.snippet.title;


      const videoId =
        item.snippet
          .resourceId
          ?.videoId;


      if (!videoId) {

        return;

      }


      const durationSec =
        durations[videoId] || 0;


      /*
        2分以内を除外
      */

      if (
        durationSec > 0 &&
        durationSec <= 120
      ) {

        return;

      }


      const lower =
        rawTitle.toLowerCase();


      /*
        ショート系を除外
      */

      if (
        /(short|ショート|ショーツ|#short|1分|60秒|ティック|tiktok)/
          .test(lower)
      ) {

        return;

      }


      /*
        YouTube動画の公開日時。

        playlistItems.snippet.publishedAt
        ではなく、
        contentDetails.videoPublishedAt
        を使用する。

        これにより、
        「プレイリストに追加された順」ではなく
        「動画が公開された順」で並べられる。
      */

      const publishedAt =
        item.contentDetails
          ?.videoPublishedAt ||
        item.snippet
          ?.publishedAt ||
        "";


      const video = {

        videoId,

        title:
          `[${pl.name}] ${rawTitle}`,

        thumbnail:
          item.snippet
            .thumbnails
            ?.medium
            ?.url ||

          item.snippet
            .thumbnails
            ?.default
            ?.url ||

          "",

        channelName:
          pl.name,

        publishedAt

      };


      videosData.push(
        video
      );


      added.push(
        video
      );

    });


    /*
      取得したページ内でも
      最新 → 古い
    */

    added.sort(
      (a, b) =>
        new Date(b.publishedAt) -
        new Date(a.publishedAt)
    );


    return added;
  }


  // =========================================================
  // 複数プレイリスト並列取得
  // =========================================================

  async function fetchMoreFromChannels(
    states
  ) {

    const results =
      await Promise.all(

        states.map(
          s =>
            fetchChannelPage(s)
              .then(
                items => ({

                  s,

                  items

                })
              )
        )

      );


    let newVideos = [];


    for (
      const {
        s,
        items
      }
      of results
    ) {

      const added =
        await processRawItems(
          items,
          s.pl
        );


      newVideos =
        newVideos.concat(
          added
        );

    }


    /*
      今回取得分も
      最新 → 古い
    */

    newVideos.sort(
      (a, b) =>
        new Date(b.publishedAt) -
        new Date(a.publishedAt)
    );


    return newVideos;
  }


  // =========================================================
  // メイン処理
  // =========================================================

  async function main() {

    loadingEl.textContent =
      "チャンネル取得中...（高速並列モード）";


    loadHistoryFromStorage();


    loadLaterFromStorage();


    /*
      チャンネル・プレイリスト選択欄
    */

    playlists.forEach(
      pl => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          pl.name;


        option.textContent =
          pl.name;


        channelFilter.appendChild(
          option
        );

      }
    );


    /*
      初回は全プレイリストから
      1ページずつ並列取得
    */

    await fetchMoreFromChannels(
      channelStates
    );


    /*
      ★重要
      全プレイリストを横断して
      最新 → 古い
      に並べ替える
    */

    videosData.sort(
      (a, b) =>
        new Date(b.publishedAt) -
        new Date(a.publishedAt)
    );


    loadingEl.style.display =
      "none";


    if (videosData.length) {

      currentFilteredData =
        [...videosData];


      currentFilteredData.sort(
        (a, b) =>
          new Date(b.publishedAt) -
          new Date(a.publishedAt)
      );


      renderMore(
        INITIAL_RENDER_COUNT
      );


      initInfiniteScroll();


    } else if (
      channelStates.every(
        s => s.exhausted
      )
    ) {

      loadingEl.style.display =
        "block";


      loadingEl.textContent =
        "動画が見つかりません";


    } else {

      currentFilteredData =
        [...videosData];


      initInfiniteScroll();


      updateSentinelPlacement();


      if (
        !sentinelEl.parentNode
      ) {

        loadingEl.style.display =
          "block";


        loadingEl.textContent =
          "動画が見つかりません";

      }

    }


    renderHistory();


    renderLater();


    updateSidebar();


    // =====================================================
    // イベント
    // =====================================================

    channelFilter.addEventListener(
      "change",
      filterVideos
    );


    searchInput.addEventListener(
      "input",
      () => {

        filterVideos();


        clearSearchBtn.style.display =
          searchInput.value
            ? "block"
            : "none";

      }
    );


    clearSearchBtn.addEventListener(
      "click",
      () => {

        searchInput.value =
          "";


        filterVideos();


        clearSearchBtn.style.display =
          "none";

      }
    );


    historyBox.addEventListener(
      "click",
      handleHistoryClick
    );


    laterBox.addEventListener(
      "click",
      handleLaterClick
    );

  }


  // =========================================================
  // 固定ボタン
  // =========================================================

  jumpBtn.addEventListener(
    "click",
    () =>
      currentActive &&
      currentActive.scrollIntoView({

        behavior: "smooth",

        block: "center"

      })
  );


  topBtn.addEventListener(
    "click",
    () =>
      document
        .getElementById(
          "videos-wrapper"
        )
        .scrollTo({

          top: 0,

          behavior: "smooth"

        })
  );


  toggleHistoryBtn.addEventListener(
    "click",
    toggleHistory
  );


  toggleLaterBtn.addEventListener(
    "click",
    toggleLater
  );


  document
    .getElementById(
      "clearHistoryBtn"
    )
    .addEventListener(
      "click",
      clearHistory
    );


  document
    .getElementById(
      "clearLaterBtn"
    )
    .addEventListener(
      "click",
      clearLaterList
    );


  // =========================================================
  // リサイズ
  // =========================================================

  function initResize() {

    const resizeBar =
      document.getElementById(
        "resize-bar"
      );


    const playerHorizontalHandle =
      document.getElementById(
        "player-horizontal-handle"
      );


    const verticalResizeBar =
      document.getElementById(
        "vertical-resize-bar"
      );


    const playerArea =
      document.getElementById(
        "player-area"
      );


    let isResizingHorizontal =
      false;


    let isResizingVertical =
      false;


    const startHorizontal =
      e => {

        isResizingHorizontal =
          true;


        resizeBar.classList.add(
          "active"
        );


        playerHorizontalHandle.style.background =
          "rgba(255,0,0,0.3)";


        document.body.style.cursor =
          "col-resize";


        e.preventDefault();

      };


    resizeBar.addEventListener(
      "mousedown",
      startHorizontal
    );


    playerHorizontalHandle.addEventListener(
      "mousedown",
      startHorizontal
    );


    verticalResizeBar.addEventListener(
      "mousedown",
      e => {

        isResizingVertical =
          true;


        verticalResizeBar.classList.add(
          "active"
        );


        document.body.style.cursor =
          "row-resize";


        e.preventDefault();

      }
    );


    document.addEventListener(
      "mousemove",
      e => {

        if (
          isResizingHorizontal
        ) {

          const mainRect =
            document
              .getElementById(
                "main"
              )
              .getBoundingClientRect();


          let newWidth =
            (
              (
                e.clientX -
                mainRect.left
              ) /
              mainRect.width
            ) * 100;


          newWidth =
            Math.max(
              25,
              Math.min(
                70,
                newWidth
              )
            );


          document.documentElement.style.setProperty(
            "--player-width",
            newWidth + "%"
          );

        }


        if (
          isResizingVertical
        ) {

          const playerRect =
            playerArea.getBoundingClientRect();


          let newHeightPx =
            e.clientY -
            playerRect.top;


          newHeightPx =
            Math.max(
              280,
              Math.min(
                window.innerHeight * 0.95,
                newHeightPx
              )
            );


          document.documentElement.style.setProperty(
            "--player-height",
            (
              newHeightPx /
              window.innerHeight *
              100
            ) + "vh"
          );

        }

      }
    );


    document.addEventListener(
      "mouseup",
      () => {

        if (
          isResizingHorizontal
        ) {

          isResizingHorizontal =
            false;


          resizeBar.classList.remove(
            "active"
          );


          playerHorizontalHandle.style.background =
            "transparent";


          document.body.style.cursor =
            "default";

        }


        if (
          isResizingVertical
        ) {

          isResizingVertical =
            false;


          verticalResizeBar.classList.remove(
            "active"
          );


          document.body.style.cursor =
            "default";

        }

      }
    );

  }


  // =========================================================
  // 起動
  // =========================================================

  initResize();


  main();

</script>
